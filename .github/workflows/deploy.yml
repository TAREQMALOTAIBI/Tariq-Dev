name: Auto Deploy to VM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via Native SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # Use standard Linux OpenSSH client with full diagnostic verbose output & StrictHostKeyChecking disabled
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key ${{ secrets.VM_USERNAME }}@${{ secrets.VM_HOST }} << 'EOF'
            set -e
            export PATH=$PATH:/usr/local/bin:/usr/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
            cd ~/Tariq-Dev || cd ~/Tariq-dev || cd ~/tariq-dev
            git fetch --all
            git reset --hard origin/main
            npm install
            npm run build
            pm2 restart all --update-env || pm2 start dist/server.cjs --name "tariq-app"
            pm2 save
            echo "🚀 Deployment completed successfully!"
          EOF
